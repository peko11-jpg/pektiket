services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pektiket
      POSTGRES_PASSWORD: pektiket_dev_pass
      POSTGRES_DB: pektiket
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: